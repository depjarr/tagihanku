<!doctype html>
<html lang="id" data-accent="biru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1A457D" />
    <title>Tagihanku · Patungan tagihan</title>
    <meta name="description" content="Tagihanku: bagi tagihan makan bareng, scan struk, dan tagih teman lewat WhatsApp atau QRIS." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
  </head>
  <body>
    <script>
      // pasang warna + mode tersimpan sebelum render pertama supaya tidak "berkedip"
      try {
        var r = document.documentElement;
        var a = localStorage.getItem('splitbill.accent') || 'biru';
        var m = localStorage.getItem('splitbill.theme') || 'light';
        r.setAttribute('data-accent', a);
        if (m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) r.classList.add('dark');
      } catch (e) {}
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
