<!doctype html>
<html lang="id" data-theme="roti">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1A457D" />
    <title>Tagihanku · Patungan tagihan</title>
    <meta name="description" content="Tagihanku: bagi tagihan makan bareng, scan struk, dan tagih teman lewat WhatsApp atau QRIS." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
  </head>
  <body>
    <script>
      // pasang tema tersimpan sebelum render pertama supaya tidak "berkedip"
      try {
        var t = localStorage.getItem('tagihanku_theme') || 'roti';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
